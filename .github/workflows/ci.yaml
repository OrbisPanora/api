name: CI

# Tests with coverage, lint, type check, a scan of the locked dependencies and a build of
# the container image. Runs on every push to main or dev and on every pull request to main.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Install
        run: uv sync --locked

      # Coverage settings, including the 80 % minimum, are in pyproject.toml.
      - name: Run pytest
        run: uv run --locked pytest --cov --cov-report=term-missing

  lint:
    name: Pylint and ty
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Install
        run: uv sync --locked

      - name: Run pylint
        run: uv run --locked pylint --rcfile=.github/workflows/pylintrc --fail-under=9.5 orbispanora_api

      - name: Run ty
        run: uv run --locked ty check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Export the locked requirements
        run: uv export --locked --no-emit-project --no-emit-package orbispanora-lib --format requirements.txt > "$RUNNER_TEMP/requirements.txt"

      - name: Look for known vulnerabilities
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  image:
    name: Container image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build, without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
