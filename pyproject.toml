[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "orbispanora-api"
version = "0.1.0"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
description = "FastAPI backend for the OrbisPanora isometric Minecraft world viewer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "numpy>=2.5",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.2",
    "requests>=2.34",
    "python-multipart>=0.0.33",
    "pillow>=13.0",
    "orbispanora-lib",
    "typer>=0.27",
]

[project.urls]
Homepage = "https://github.com/OrbisPanora/api"
Issues = "https://github.com/OrbisPanora/api/issues"

[project.scripts]
orbispanora = "orbispanora_api.cli:app"

[project.optional-dependencies]
redis = ["redis>=7"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "pytest-cov>=7.1",
    "pylint>=4.0",
    "ty>=0.0.80",
    # Not imported at runtime unless the cache type is redis, but ty needs it to check cache_service.py.
    "redis>=7",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "orbispanora_api"
module-root = ""

[tool.uv.sources]
# The library is installed from GitHub, at a release tag. uv.lock pins the commit.
orbispanora-lib = { git = "https://github.com/OrbisPanora/lib", tag = "v0.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["orbispanora_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
